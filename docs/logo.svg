<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AssetScanner Pro logo</title>
  <desc id="desc">AssetScanner Pro brand mark with a radar scanner icon and version text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.56" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="34" fill="url(#bg)"/>
  <circle cx="178" cy="160" r="96" fill="#0f172a" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="178" cy="160" r="68" fill="none" stroke="#38bdf8" stroke-opacity="0.42" stroke-width="2"/>
